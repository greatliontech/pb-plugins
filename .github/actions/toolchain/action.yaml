# Installs the toolchain the catalog pins for a kind on this runner,
# and on linux what makes the kind's executable static beside it:
# rust through rustup (the toolchain, then the musl target); swift
# through swiftly (the toolchain, then the static Linux SDK at the
# URL and checksum swift.org publishes for the release, read by
# `catalog sdk`, held equal to the catalog's pin). The versions and
# targets are the catalog's, read here, so a runner installs what
# the catalog at this commit names.
name: toolchain
description: install the catalog's pinned toolchain for a kind
inputs:
  kind:
    required: true
runs:
  using: composite
  steps:
    - name: Install the ${{ inputs.kind }} toolchain
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        kind="$KIND"
        v=$(go run ./cmd/catalog toolchain "$kind")
        t=$(go run ./cmd/catalog target "$kind")
        case "$kind" in
        rust)
          rustup toolchain install "$v" --profile minimal && rustup default "$v"
          if [ -n "$t" ]; then rustup target add "$t"; fi
          ;;
        swift)
          case "$RUNNER_OS" in
          Linux)
            curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zx -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/swiftly" init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
            home="${XDG_DATA_HOME:-$HOME/.local/share}/swiftly"
            ;;
          macOS)
            curl -fsSL -o "$RUNNER_TEMP/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
            installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
            "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
            home="$HOME/.swiftly"
            ;;
          *) echo "swift is not pinned on $RUNNER_OS" >&2; exit 1 ;;
          esac
          . "$home/env.sh"
          swiftly install --use --assume-yes --post-install-file "$RUNNER_TEMP/swiftly-post.sh" "$v"
          if [ -s "$RUNNER_TEMP/swiftly-post.sh" ]; then sudo apt-get update && sudo sh "$RUNNER_TEMP/swiftly-post.sh"; fi
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"
          if [ -n "$t" ]; then
            sdk=$(go run ./cmd/catalog sdk "$kind")
            read -r url sum <<<"$sdk"
            swift sdk install "$url" --checksum "$sum"
          fi
          swift --version
          ;;
        *) echo "no toolchain is pinned for the $kind kind" >&2; exit 1 ;;
        esac
