name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
        shell: bash
      - run: go mod tidy -diff
      - run: go vet ./...
      - name: Pin the rust toolchain, as the catalog has it
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/toolchain
        with:
          kind: rust
      - name: Pin the swift toolchain, as the catalog has it
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/toolchain
        with:
          kind: swift
      - run: go run ./cmd/catalog check
      - run: go test ./... -count=1 -timeout 40m
        env:
          PBPLUGINS_LIVE: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
