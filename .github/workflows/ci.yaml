name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
        shell: bash
      - run: go mod tidy -diff
      - run: go vet ./...
      # The live recipe tests run on every row, each building its
      # own platform's trees, so a tree a native kind would publish
      # is built here first; the swift kind serves no windows.
      - name: Pin the rust toolchain, as the catalog has it
        uses: ./.github/actions/toolchain
        with:
          kind: rust
      - name: Pin the swift toolchain, as the catalog has it
        if: runner.os != 'Windows'
        uses: ./.github/actions/toolchain
        with:
          kind: swift
      - name: Pin the dart toolchain, as the catalog has it
        uses: ./.github/actions/toolchain
        with:
          kind: dart
      - name: Pin the jvm toolchain, as the catalog has it
        uses: ./.github/actions/toolchain
        with:
          kind: jvm
      - run: go run ./cmd/catalog check
      - run: go test ./... -count=1 -timeout 40m
        env:
          PBPLUGINS_LIVE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
