# Publishes every plugin version the registry lacks: the plan reads
# the registry; a cross-building kind builds its platforms and
# publishes in one job; a native kind builds one tree job per
# platform on that platform's runner and a publish job packages them
# once all are built. Publishing is `pb plugin build` into one list,
# signed keyless. A tag once published is never rebuilt: the plan
# leaves it out, and pb refuses to publish over it.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cross: ${{ steps.plan.outputs.cross }}
      trees: ${{ steps.plan.outputs.trees }}
      builds: ${{ steps.plan.outputs.builds }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Registry credentials
        run: |
          mkdir -p ~/.docker
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GITHUB_TOKEN" | base64 -w0)" > ~/.docker/config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        run: |
          go run ./cmd/catalog plan
          go run ./cmd/catalog plan --json > plan.json
          echo "cross=$(jq -c .cross plan.json)" >> "$GITHUB_OUTPUT"
          echo "trees=$(jq -c .trees plan.json)" >> "$GITHUB_OUTPUT"
          echo "builds=$(jq -c .builds plan.json)" >> "$GITHUB_OUTPUT"
          echo "any=$(jq -r .any plan.json)" >> "$GITHUB_OUTPUT"

  # A cross-building kind builds every platform on one runner and
  # publishes at once; a native kind builds one platform per runner
  # and publishes below, once its trees are all built.
  cross:
    needs: plan
    if: needs.plan.outputs.any == 'true' && fromJSON(needs.plan.outputs.cross).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cross) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    name: publish ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        if: matrix.kind == 'node'
        with:
          bun-version: 1.4.2
      - name: Build the trees
        run: go run ./cmd/catalog tree "${{ matrix.plugin }}" "${{ matrix.version }}" --platform "${{ matrix.platforms }}" --out trees
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish
        with:
          plugin: ${{ matrix.plugin }}
          version: ${{ matrix.version }}
          app-id: ${{ vars.GLT_RELEASER_APP_ID }}
          app-key: ${{ secrets.GLT_RELEASER_APP_KEY }}
          pb-commit: ${{ vars.PB_COMMIT || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  tree:
    needs: plan
    if: needs.plan.outputs.any == 'true' && fromJSON(needs.plan.outputs.trees).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.trees) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    name: tree ${{ matrix.tree }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pin the toolchain
        if: matrix.toolchain != ''
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal && rustup default "${{ matrix.toolchain }}"
        shell: bash
      - name: Build the tree
        run: go run ./cmd/catalog tree "${{ matrix.plugin }}" "${{ matrix.version }}" --platform "${{ matrix.platforms }}" --out trees
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: tree-${{ matrix.tree }}
          path: trees
          if-no-files-found: error
          retention-days: 3

  # Each native plugin version publishes once its own trees are all
  # built: another version's failed tree job stops nothing here, and
  # a missing tree fails this job at the download.
  publish:
    needs: [plan, tree]
    if: needs.plan.outputs.any == 'true' && !cancelled() && fromJSON(needs.plan.outputs.builds).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: publish ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: tree-${{ matrix.build }}-*
          path: trees
          merge-multiple: true
      - uses: ./.github/actions/publish
        with:
          plugin: ${{ matrix.plugin }}
          version: ${{ matrix.version }}
          app-id: ${{ vars.GLT_RELEASER_APP_ID }}
          app-key: ${{ secrets.GLT_RELEASER_APP_KEY }}
          pb-commit: ${{ vars.PB_COMMIT || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
