  # kind swift: a SwiftPM product built at the repository's tag on a
  # runner of the platform itself, with the toolchain pinned above,
  # held to the package's lockfile where it commits one; the versions
  # the repository's releases. The Linux executable is static, built
  # with swift.org's static Linux SDK: no base. Windows is not served:
  # no upstream builds its generator there.
  apple/swift:
    source: https://github.com/apple/swift-protobuf
    kind: swift
    repository: apple/swift-protobuf
    tag: "{version}"
    product: protoc-gen-swift
    entrypoint: protoc-gen-swift
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
  # connect-swift: the generator and its mocks, products of one
  # package; the lockfile it commits holds the build.
  connectrpc/swift:
    source: https://github.com/connectrpc/connect-swift
    kind: swift
    repository: connectrpc/connect-swift
    tag: "{version}"
    product: protoc-gen-connect-swift
    entrypoint: protoc-gen-connect-swift
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
  connectrpc/swift-mocks:
    source: https://github.com/connectrpc/connect-swift
    kind: swift
    repository: connectrpc/connect-swift
    tag: "{version}"
    product: protoc-gen-connect-swift-mocks
    entrypoint: protoc-gen-connect-swift-mocks
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
  # connect-swift before its move to connectrpc; deprecated upstream,
  # its last release the one published, built from the moved
  # repository, which keeps the tag.
  bufbuild/connect-swift:
    source: https://github.com/connectrpc/connect-swift
    kind: swift
    repository: connectrpc/connect-swift
    tag: "{version}"
    product: protoc-gen-connect-swift
    entrypoint: protoc-gen-connect-swift
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    frozen: true
  bufbuild/connect-swift-mocks:
    source: https://github.com/connectrpc/connect-swift
    kind: swift
    repository: connectrpc/connect-swift
    tag: "{version}"
    product: protoc-gen-connect-swift-mocks
    entrypoint: protoc-gen-connect-swift-mocks
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    frozen: true
  # grpc-swift's 1.x line carries protoc-gen-grpc-swift; its 2.x
  # releases in the same repository do not, the generator having
  # moved to grpc-swift-protobuf (grpc/swift-protobuf below).
  grpc/swift:
    source: https://github.com/grpc/grpc-swift
    kind: swift
    repository: grpc/grpc-swift
    tag: "{version}"
    product: protoc-gen-grpc-swift
    entrypoint: protoc-gen-grpc-swift
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    line: v1
  grpc/swift-protobuf:
    source: https://github.com/grpc/grpc-swift-protobuf
    kind: swift
    repository: grpc/grpc-swift-protobuf
    tag: "{version}"
    product: protoc-gen-grpc-swift-2
    entrypoint: protoc-gen-grpc-swift-2
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]

  # kind dart: a package's script compiled to an executable at the
  # repository's tag on a runner of the platform itself, with the
  # SDK pinned above; the versions the repository's releases. The
  # runtime links the C library: base applies.
  # protoc_plugin lives in protobuf.dart's monorepo, tagged under its
  # own prefix beside the protobuf package's tags.
  protocolbuffers/dart:
    source: https://github.com/google/protobuf.dart
    kind: dart
    repository: google/protobuf.dart
    tag: protoc_plugin-v{version}
    dir: protoc_plugin
    main: bin/protoc_plugin.dart
    entrypoint: protoc-gen-dart
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  connectrpc/dart:
    source: https://github.com/connectrpc/connect-dart
    kind: dart
    repository: connectrpc/connect-dart
    tag: v{version}
    dir: packages/connect
    main: bin/protoc-gen-connect-dart.dart
    entrypoint: protoc-gen-connect-dart
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]

  # kind jvm: a jar from Maven Central bundled with a runtime linked
  # for every platform from the pinned JDK's modules, the image's
  # process `jre/bin/java -jar <jar>`; the versions Maven's. The
  # runtime links the C library: base applies. The jar is verified
  # against the digest Maven publishes beside it, sha256 where it has
  # one, sha1 for every artifact. ScalaPB's generators publish the
  # runnable jar with a shell prefix under the unix classifier, the
  # plain jar carrying no main class.
  community/scalapb-zio-grpc:
    source: https://github.com/scalapb/zio-grpc
    kind: jvm
    maven: com.thesamet.scalapb.zio-grpc:protoc-gen-zio
    classifier: unix
    extension: sh
    checksum: sha1
    entrypoint: protoc-gen-zio
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  grpc/kotlin:
    source: https://github.com/grpc/grpc-kotlin
    kind: jvm
    maven: io.grpc:protoc-gen-grpc-kotlin
    classifier: jdk8
    checksum: sha256
    entrypoint: protoc-gen-grpc-kotlin
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  connectrpc/kotlin:
    source: https://github.com/connectrpc/connect-kotlin
    kind: jvm
    maven: com.connectrpc:protoc-gen-connect-kotlin
    checksum: sha256
    entrypoint: protoc-gen-connect-kotlin
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # connect-kotlin before its move to connectrpc; deprecated upstream,
  # its last release the one published.
  bufbuild/connect-kotlin:
    source: https://github.com/bufbuild/connect-kotlin
    kind: jvm
    maven: build.buf:protoc-gen-connect-kotlin
    checksum: sha256
    entrypoint: protoc-gen-connect-kotlin
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    frozen: true

  # kind node, running under node's own runtime: a package needing
  # its files on disk — knit-ts loads typescript at run time, ts-proto
  # formats its output through dprint-node's native addon — rather
  # than compiled by bun into one executable; node's binary for every
  # platform bundled at the version pinned above, from nodejs.org at
  # the checksums it publishes, the image's process
  # `/node app/node_modules/<package>/<script>`. node links the C
  # library: base applies.
  bufbuild/knit-ts:
    source: https://github.com/bufbuild/knit-ts
    kind: node
    package: "@bufbuild/protoc-gen-knit-ts"
    runtime: true
    script: bin/protoc-gen-knit-ts
    entrypoint: protoc-gen-knit-ts
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # dprint-node ships its addon for every platform but windows/arm64,
  # where the generator cannot load it.
  community/stephenh-ts-proto:
    source: https://github.com/stephenh/ts-proto
    kind: node
    package: ts-proto
    runtime: true
    script: protoc-gen-ts_proto
    entrypoint: protoc-gen-ts_proto
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]

  # kind python: a PyPI package's console script run by the
  # standalone CPython build bundled for every platform, from
  # python-build-standalone at the release pinned above and the
  # checksums it publishes; the package installed per platform by uv,
  # which picks that platform's wheels, under `app/`; the image's
  # process `/python/bin/python3 -I app/<entrypoint>.py`. CPython links
  # the C library: base applies.
  bufbuild/py:
    source: https://github.com/bufbuild/protobuf-py
    kind: python
    pypi: protoc-gen-py
    entrypoint: protoc-gen-py
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  bufbuild/grpc-py:
    source: https://github.com/bufbuild/protoc-gen-grpc-py
    kind: python
    pypi: protoc-gen-grpc-py
    entrypoint: protoc-gen-grpc-py
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  connectrpc/py:
    source: https://github.com/connectrpc/connect-py
    kind: python
    pypi: protoc-gen-connectrpc
    entrypoint: protoc-gen-connectrpc
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
