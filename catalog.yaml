# The plugin catalog: buf's plugin names, each published under
# ghcr.io/greatliontech/pb-plugins/<name>:<version> from a recipe of
# its own. The versions published are plugins/<name>/versions, one
# tag per line ascending; a recipe's own files under plugins/<name>/files.
#
# Every kind produces, per platform, the tree the image's process
# runs from: for most kinds one file, the entrypoint at the tree's
# root, which `pb plugin build` packages as the image's
# `/<entrypoint>`; a runtime program ships its runtime beside it (a
# jvm recipe's `jre/`, a runtime node recipe's `node` beside the
# package under `app/`, a python recipe's `python/` beside it). Where
# a kind's Linux executables link the platform's C library (node,
# release, bazel, dart, jvm and python), the Linux trees
# are layered over `base`, pinned by its index digest and resolved to
# the platform's own image at publish.
registry: ghcr.io/greatliontech/pb-plugins
base: gcr.io/distroless/cc-debian13@sha256:4594d59540d1948417f6ca2829ddd9294493a7c68b7528f4dd459de7f203a750
# The toolchains the pipeline pins on a runner before a kind's build.
toolchains:
  rust: 1.98.1
  swift: 6.4.0
  dart: 3.13.5
  jvm: 21.0.12.1+1
  node: 24.21.0
  # The python kind's interpreter (CPython's version and
  # python-build-standalone's release) and installer, which a build
  # fetches for itself at their published checksums.
  python: 3.13.16+20261001
  uv: 0.12.22
# The sha256 of the static Linux SDK bundle swift.org publishes for
# the Swift release pinned above, which the runner installs beside
# the toolchain; `catalog sdk swift` reads swift.org's and holds the
# two equal.
sdks:
  swift: 47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e

plugins:
  # kind go: a Go main package cross-compiled with CGO disabled to
  # every platform; the versions discovered from the module proxy.
  protocolbuffers/go:
    source: https://github.com/protocolbuffers/protobuf-go
    kind: go
    module: google.golang.org/protobuf
    package: cmd/protoc-gen-go
    entrypoint: protoc-gen-go
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  grpc/go:
    source: https://github.com/grpc/grpc-go
    kind: go
    module: google.golang.org/grpc/cmd/protoc-gen-go-grpc
    package: .
    entrypoint: protoc-gen-go-grpc
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  connectrpc/go:
    source: https://github.com/connectrpc/connect-go
    kind: go
    module: connectrpc.com/connect
    package: cmd/protoc-gen-connect-go
    entrypoint: protoc-gen-connect-go
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]

  # buf's gosimple is connect-go's generator under another name: the
  # BSR's generated SDKs pass it `simple`, a generation file passes what
  # it wants.
  connectrpc/gosimple:
    source: https://github.com/connectrpc/connect-go
    kind: go
    module: connectrpc.com/connect
    package: cmd/protoc-gen-connect-go
    entrypoint: protoc-gen-connect-go
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # connect-go before its move to connectrpc; upstream archived, its
  # last release the one published.
  bufbuild/connect-go:
    source: https://github.com/bufbuild/connect-go
    kind: go
    module: github.com/bufbuild/connect-go
    package: cmd/protoc-gen-connect-go
    entrypoint: protoc-gen-connect-go
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  bufbuild/validate-go:
    source: https://github.com/bufbuild/protoc-gen-validate
    kind: go
    module: github.com/envoyproxy/protoc-gen-validate
    package: cmd/protoc-gen-validate-go
    entrypoint: protoc-gen-validate-go
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # A Go program, whatever its target language.
  bufbuild/validate-cpp:
    source: https://github.com/bufbuild/protoc-gen-validate
    kind: go
    module: github.com/envoyproxy/protoc-gen-validate
    package: cmd/protoc-gen-validate-cpp
    entrypoint: protoc-gen-validate-cpp
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # The Java generator is the same Go generator with its language
  # fixed to java, as buf builds it; deprecated upstream for
  # protovalidate, its versions the module's as its siblings' are.
  # Silent: it generates only for a file that imports PGV's
  # validate.proto, which carries the options, and the probe's file
  # imports nothing; its siblings generate for every file.
  bufbuild/validate-java:
    source: https://github.com/bufbuild/protoc-gen-validate
    kind: go
    module: github.com/envoyproxy/protoc-gen-validate
    package: cmd/protoc-gen-validate-java
    entrypoint: protoc-gen-validate-java
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    silent: true
  # The bigquery generator left the module after v0.1.3, its last
  # version the one published: frozen, the module's later versions
  # carrying no such package.
  bufbuild/protoschema-bigquery:
    source: https://github.com/bufbuild/protoschema-plugins
    kind: go
    module: github.com/bufbuild/protoschema-plugins
    package: cmd/protoc-gen-bigquery
    entrypoint: protoc-gen-bigquery
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    frozen: true
  bufbuild/protoschema-jsonschema:
    source: https://github.com/bufbuild/protoschema-plugins
    kind: go
    module: github.com/bufbuild/protoschema-plugins
    package: cmd/protoc-gen-jsonschema
    entrypoint: protoc-gen-jsonschema
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  bufbuild/protoschema-pubsub:
    source: https://github.com/bufbuild/protoschema-plugins
    kind: go
    module: github.com/bufbuild/protoschema-plugins
    package: cmd/protoc-gen-pubsub
    entrypoint: protoc-gen-pubsub
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # Upstream as released: buf's image patches the gateway with a
  # `separate_package` option for its generated SDKs' package layout,
  # which this one refuses as unknown.
  # Silent: the gateway generates for rpcs carrying HTTP annotations,
  # which the probe's file lacks.
  grpc-ecosystem/gateway:
    source: https://github.com/grpc-ecosystem/grpc-gateway
    kind: go
    module: github.com/grpc-ecosystem/grpc-gateway/v2
    package: protoc-gen-grpc-gateway
    entrypoint: protoc-gen-grpc-gateway
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    silent: true
  grpc-ecosystem/openapiv2:
    source: https://github.com/grpc-ecosystem/grpc-gateway
    kind: go
    module: github.com/grpc-ecosystem/grpc-gateway/v2
    package: protoc-gen-openapiv2
    entrypoint: protoc-gen-openapiv2
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # Silent: openapiv3 generates for rpcs carrying HTTP annotations,
  # which the probe's file lacks.
  grpc-ecosystem/openapiv3:
    source: https://github.com/grpc-ecosystem/grpc-gateway
    kind: go
    module: github.com/grpc-ecosystem/grpc-gateway/v2
    package: protoc-gen-openapiv3
    entrypoint: protoc-gen-openapiv3
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    silent: true
  pluginrpc/go:
    source: https://github.com/pluginrpc/pluginrpc-go
    kind: go
    module: pluginrpc.com/pluginrpc
    package: cmd/protoc-gen-pluginrpc-go
    entrypoint: protoc-gen-pluginrpc-go
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  community/planetscale-vtprotobuf:
    source: https://github.com/planetscale/vtprotobuf
    kind: go
    module: github.com/planetscale/vtprotobuf
    package: cmd/protoc-gen-go-vtproto
    entrypoint: protoc-gen-go-vtproto
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  community/mfridman-go-json:
    source: https://github.com/mfridman/protoc-gen-go-json
    kind: go
    module: github.com/mfridman/protoc-gen-go-json
    package: .
    entrypoint: protoc-gen-go-json
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # Upstream archived, its last release the one published.
  community/mitchellh-go-json:
    source: https://github.com/mitchellh/protoc-gen-go-json
    kind: go
    module: github.com/mitchellh/protoc-gen-go-json
    package: .
    entrypoint: protoc-gen-go-json
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  community/pseudomuto-doc:
    source: https://github.com/pseudomuto/protoc-gen-doc
    kind: go
    module: github.com/pseudomuto/protoc-gen-doc
    package: cmd/protoc-gen-doc
    entrypoint: protoc-gen-doc
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  community/google-gnostic-openapi:
    source: https://github.com/google/gnostic
    kind: go
    module: github.com/google/gnostic
    package: cmd/protoc-gen-openapi
    entrypoint: protoc-gen-openapi
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # Built with upstream's `remote_plugin` tag, as buf builds it: the
  # tag turns off the options reading a file beside the plugin (`base`,
  # `override`) with a message saying so, and an oci plugin pb runs
  # sees the image's filesystem alone (pb's plugin-execution.md).
  community/sudorandom-connect-openapi:
    source: https://github.com/sudorandom/protoc-gen-connect-openapi
    kind: go
    module: github.com/sudorandom/protoc-gen-connect-openapi
    package: .
    tags: [remote_plugin]
    entrypoint: protoc-gen-connect-openapi
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # Silent: the federation generates for services carrying its options,
  # which the probe's file lacks.
  community/mercari-grpc-federation:
    source: https://github.com/mercari/grpc-federation
    kind: go
    module: github.com/mercari/grpc-federation
    package: cmd/protoc-gen-grpc-federation
    entrypoint: protoc-gen-grpc-federation
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    silent: true

  # kind node: an npm package's executable compiled with bun into one
  # standalone executable per platform; the versions discovered from
  # the npm registry. The Linux executables link glibc: base applies.
  bufbuild/es:
    source: https://github.com/bufbuild/protobuf-es
    kind: node
    package: "@bufbuild/protoc-gen-es"
    entrypoint: protoc-gen-es
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  connectrpc/es:
    source: https://github.com/connectrpc/connect-es
    kind: node
    package: "@connectrpc/protoc-gen-connect-es"
    entrypoint: protoc-gen-connect-es
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]

  # connect-es before its move to connectrpc; the package deprecated
  # upstream, its last release the one published.
  bufbuild/connect-es:
    source: https://github.com/bufbuild/connect-es
    kind: node
    package: "@bufbuild/protoc-gen-connect-es"
    entrypoint: protoc-gen-connect-es
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # The package deprecated upstream, its last release the one published.
  bufbuild/connect-web:
    source: https://github.com/bufbuild/connect-es
    kind: node
    package: "@bufbuild/protoc-gen-connect-web"
    entrypoint: protoc-gen-connect-web
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # connect-query before its move to connectrpc; the package deprecated
  # upstream, its last release the one published.
  bufbuild/connect-query:
    source: https://github.com/bufbuild/connect-query
    kind: node
    package: "@bufbuild/protoc-gen-connect-query"
    entrypoint: protoc-gen-connect-query
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  connectrpc/query-es:
    source: https://github.com/connectrpc/connect-query-es
    kind: node
    package: "@connectrpc/protoc-gen-connect-query"
    entrypoint: protoc-gen-connect-query
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  community/timostamm-protobuf-ts:
    source: https://github.com/timostamm/protobuf-ts
    kind: node
    package: "@protobuf-ts/plugin"
    entrypoint: protoc-gen-ts
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]

  # kind go from a repository tag: the versions are the repository's
  # releases, their tags not on the module proxy's list — unprefixed,
  # or a nested module's released under the root's tags — and the
  # module, named by its directory, is fetched at the tag's commit,
  # its path read from the go.mod there.
  community/chrusty-jsonschema:
    source: https://github.com/chrusty/protoc-gen-jsonschema
    kind: go
    repository: chrusty/protoc-gen-jsonschema
    tag: "{version}"
    dir: .
    package: cmd/protoc-gen-jsonschema
    entrypoint: protoc-gen-jsonschema
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  community/roadrunner-server-php-grpc:
    source: https://github.com/roadrunner-server/grpc
    kind: go
    repository: roadrunner-server/grpc
    tag: v{version}
    dir: protoc_plugins
    package: protoc-gen-php-grpc
    entrypoint: protoc-gen-php-grpc
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # Connect's first Python generator was a Go program, shipped to
  # PyPI inside a wheel as an executable; its module lives in the
  # repository's protoc-gen-connect-python directory. Deprecated
  # upstream for connectrpc/py, frozen at its last.
  connectrpc/python:
    source: https://github.com/connectrpc/connect-python
    kind: go
    repository: connectrpc/connect-python
    tag: v{version}
    dir: protoc-gen-connect-python
    package: .
    entrypoint: protoc-gen-connectrpc
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    frozen: true

  # kind rust: a crate's executable installed with cargo on a runner
  # of the platform itself, with the toolchain pinned above, locked
  # to the lockfile the crate publishes (one without is refused); the
  # versions discovered from crates.io. The Linux executable is
  # static, built for the musl target: no base (a version published
  # before that rule keeps the trees it was published with).
  connectrpc/rust:
    source: https://github.com/connectrpc/connect-rust
    kind: rust
    crate: connectrpc-codegen
    entrypoint: protoc-gen-connect-rust
    # The generator answers nothing without the module its message
    # types live in.
    parameter: extern_path=.=crate::proto
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]

  # kind release: an executable an upstream GitHub release ships
  # prebuilt, one asset per platform it ships for, the member named
  # extracted from it (`members` naming a platform's own); the
  # versions discovered from the releases. The Linux executables link
  # glibc: base applies.
  # A release recipe may name its assets by URL instead, wherever
  # upstream publishes, its versions then Maven Central's or the npm
  # registry's as the recipe says; an asset that is the executable
  # itself takes no member; a digest upstream publishes beside each
  # asset is verified.
  grpc/java:
    source: https://github.com/grpc/grpc-java
    kind: release
    maven: io.grpc:protoc-gen-grpc-java
    checksum: sha256
    entrypoint: protoc-gen-grpc-java
    assets:
      linux/amd64: https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/{version}/protoc-gen-grpc-java-{version}-linux-x86_64.exe
      linux/arm64: https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/{version}/protoc-gen-grpc-java-{version}-linux-aarch_64.exe
      darwin/amd64: https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/{version}/protoc-gen-grpc-java-{version}-osx-x86_64.exe
      darwin/arm64: https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/{version}/protoc-gen-grpc-java-{version}-osx-aarch_64.exe
      windows/amd64: https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/{version}/protoc-gen-grpc-java-{version}-windows-x86_64.exe
  # ScalaPB's protoc-gen-scala from the jar Maven publishes for every
  # version (the runnable one under the unix classifier), as buf
  # serves it: v0.11.17's published trees, built from the
  # release's native executables for linux and darwin on x86_64,
  # stand as published; the versions from v0.11.18 on build here.
  community/scalapb-scala:
    source: https://github.com/scalapb/ScalaPB
    kind: jvm
    maven: com.thesamet.scalapb:protoc-gen-scala
    classifier: unix
    extension: sh
    checksum: sha1
    entrypoint: protoc-gen-scala
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
  # grpc-tools' executable, numbered by grpc-tools, at grpc's binary
  # host under node's platform names; the darwin archive lays its
  # files under the architecture's directory. Upstream's darwin-arm64
  # archive holds an x86_64 executable alone, no arm64 one, so
  # darwin/arm64 is not served.
  grpc/node:
    source: https://github.com/grpc/grpc-node
    kind: release
    npm: grpc-tools
    member: bin/grpc_node_plugin{exe}
    members:
      darwin/amd64: x64/grpc_node_plugin
    entrypoint: grpc_node_plugin
    assets:
      linux/amd64: https://node-precompiled-binaries.grpc.io/grpc-tools/v{version}/linux-x64.tar.gz
      linux/arm64: https://node-precompiled-binaries.grpc.io/grpc-tools/v{version}/linux-arm64.tar.gz
      darwin/amd64: https://node-precompiled-binaries.grpc.io/grpc-tools/v{version}/darwin-x64.tar.gz
      windows/amd64: https://node-precompiled-binaries.grpc.io/grpc-tools/v{version}/win32-x64.tar.gz
  protocolbuffers/js:
    source: https://github.com/protocolbuffers/protobuf-javascript
    kind: release
    repository: protocolbuffers/protobuf-javascript
    tag: v{version}
    member: bin/protoc-gen-js{exe}
    entrypoint: protoc-gen-js
    assets:
      linux/amd64: protobuf-javascript-{version}-linux-x86_64.tar.gz
      linux/arm64: protobuf-javascript-{version}-linux-aarch_64.tar.gz
      darwin/amd64: protobuf-javascript-{version}-osx-x86_64.tar.gz
      darwin/arm64: protobuf-javascript-{version}-osx-aarch_64.tar.gz
      windows/amd64: protobuf-javascript-{version}-win64.zip

  # kind bazel: a C++ target built by bazel from an upstream source
  # archive, on a runner of each platform (no cross-compilation);
  # the versions discovered from the repository's releases. The
  # Linux executables link glibc and libstdc++: base applies.
  # windows/arm64 is not served: no bazel C++ toolchain is
  # established for it.
  grpc/web:
    source: https://github.com/grpc/grpc-web
    kind: bazel
    repository: grpc/grpc-web
    tag: "{version}"
    archive: https://github.com/grpc/grpc-web/releases/download/{version}/grpc-web-source-{version}.tar.gz
    strip: 1
    target: //javascript/net/grpc/web/generator:protoc-gen-grpc-web
    output: bazel-bin/javascript/net/grpc/web/generator/protoc-gen-grpc-web{exe}
    entrypoint: protoc-gen-grpc-web
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    # The source's rc passes a GCC warning flag MSVC refuses to every
    # compile ("common build settings for unix-like systems").
    options:
      windows:
        startup: [--noworkspace_rc]
  protocolbuffers/csharp:
    source: https://github.com/protocolbuffers/protobuf
    kind: bazel
    repository: protocolbuffers/protobuf
    tag: v{version}
    archive: https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protobuf-{version}.tar.gz
    strip: 1
    files: plugins
    target: //plugins:protoc-gen-csharp
    output: bazel-bin/plugins/protoc-gen-csharp{exe}
    entrypoint: protoc-gen-csharp
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    # protobuf's own windows configuration: clang-cl, as its CI builds.
    options:
      windows:
        build: [--config=windows]
  grpc/csharp:
    source: https://github.com/grpc/grpc
    kind: bazel
    repository: grpc/grpc
    tag: v{version}
    archive: https://github.com/grpc/grpc/archive/refs/tags/v{version}.tar.gz
    strip: 1
    target: //src/compiler:grpc_csharp_plugin
    # The output is a copy of the linked binary, carrying no .exe on
    # windows either.
    output: bazel-bin/src/compiler/grpc_csharp_plugin_binary
    entrypoint: grpc_csharp_plugin
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    # grpc's own windows configuration: MSVC's C++17 flag spelling.
    options:
      windows:
        build: [--config=windows]
  protocolbuffers/cpp:
    source: https://github.com/protocolbuffers/protobuf
    kind: bazel
    repository: protocolbuffers/protobuf
    tag: v{version}
    archive: https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protobuf-{version}.tar.gz
    strip: 1
    files: plugins
    target: //plugins:protoc-gen-cpp
    output: bazel-bin/plugins/protoc-gen-cpp{exe}
    entrypoint: protoc-gen-cpp
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    options:
      windows:
        build: [--config=windows]
  protocolbuffers/java:
    source: https://github.com/protocolbuffers/protobuf
    kind: bazel
    repository: protocolbuffers/protobuf
    tag: v{version}
    archive: https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protobuf-{version}.tar.gz
    strip: 1
    files: plugins
    target: //plugins:protoc-gen-java
    output: bazel-bin/plugins/protoc-gen-java{exe}
    entrypoint: protoc-gen-java
    platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    options:
      windows:
        build: [--config=windows]
  protocolbuffers/kotlin:
    source: https://github.com/protocolbuffers/protobuf
    kind: bazel
    repository: protocolbuffers/protobuf
    tag: v{version}
    archive: https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protobuf-{version}.tar.gz
    strip: 1
    files: plugins
    target: //plugins:protoc-gen-kotlin
    output: bazel-bin/plugins/protoc-gen-kotlin{exe}
